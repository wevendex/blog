<?xml version="1.0" encoding="utf-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F7931E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0F0F0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景圆角矩形 -->
  <rect x="20" y="20" width="472" height="472" rx="80" ry="80" fill="url(#bgGradient)" stroke="#333" stroke-width="4"/>
  
  <!-- 卡牌1 -->
  <g transform="translate(80, 120) rotate(-15)">
    <rect x="0" y="0" width="120" height="160" rx="12" ry="12" fill="url(#cardGradient)" stroke="#333" stroke-width="3"/>
    <text x="20" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FF0000">A</text>
    <text x="20" y="50" font-family="Arial, sans-serif" font-size="20" fill="#FF0000">♥</text>
    <text x="60" y="100" font-family="Arial, sans-serif" font-size="60" fill="#FF0000" text-anchor="middle">♥</text>
  </g>
  
  <!-- 卡牌2 -->
  <g transform="translate(200, 100) rotate(0)">
    <rect x="0" y="0" width="120" height="160" rx="12" ry="12" fill="url(#cardGradient)" stroke="#333" stroke-width="3"/>
    <text x="20" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#000000">K</text>
    <text x="20" y="50" font-family="Arial, sans-serif" font-size="20" fill="#000000">♠</text>
    <text x="60" y="100" font-family="Arial, sans-serif" font-size="60" fill="#000000" text-anchor="middle">♠</text>
  </g>
  
  <!-- 卡牌3 -->
  <g transform="translate(320, 120) rotate(15)">
    <rect x="0" y="0" width="120" height="160" rx="12" ry="12" fill="url(#cardGradient)" stroke="#333" stroke-width="3"/>
    <text x="20" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FF0000">Q</text>
    <text x="20" y="50" font-family="Arial, sans-serif" font-size="20" fill="#FF0000">♦</text>
    <text x="60" y="100" font-family="Arial, sans-serif" font-size="60" fill="#FF0000" text-anchor="middle">♦</text>
  </g>
  
  <!-- 游戏标题 -->
  <text x="256" y="380" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#FFFFFF" text-anchor="middle">斗地主</text>
  <text x="256" y="420" font-family="Arial, sans-serif" font-size="24" fill="#FFFFFF" text-anchor="middle">Landlords</text>
  
  <!-- 装饰元素 -->
  <circle cx="120" cy="400" r="8" fill="#FFD700" opacity="0.8"/>
  <circle cx="392" cy="400" r="8" fill="#FFD700" opacity="0.8"/>
  <circle cx="256" cy="450" r="6" fill="#FFD700" opacity="0.6"/>
</svg>